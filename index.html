<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YWCSU Bingo 票務管理系統</title>
<link rel="icon" href="logo.png" type="image/x-icon">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#eef1f6;color:#1c2333;font-size:15px;line-height:1.55;min-height:100%;
  display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}
.muted{color:#8a93a6}
.sub{font-size:12px;color:#8a93a6;font-weight:400}

.login-screen{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(135deg,#1B3A6B 0%,#28508f 60%,#1B3A6B 100%);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:loginFadeIn .3s ease;
}
.login-screen[hidden]{display:none}
@keyframes loginFadeIn{from{opacity:0}to{opacity:1}}
.login-card{
  background:#fff;border-radius:20px;padding:32px 26px 26px;
  width:100%;max-width:440px;
  box-shadow:0 24px 70px rgba(0,0,0,.4);
  animation:loginPop .3s ease;
}
@keyframes loginPop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.login-logo{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:20px;
}
.login-logo img{
  width:38px;height:38px;object-fit:contain;
  border-radius:10px;padding:2px;background:#fff;
}
.login-card h2{
  font-size:20px;font-weight:800;color:#1B3A6B;
  text-align:center;margin-bottom:6px;letter-spacing:.3px;
}
.login-sub{
  text-align:center;color:#6b7488;font-size:13.5px;
  margin-bottom:22px;line-height:1.6;
}
.login-sub b{color:#1B3A6B}
.login-card input{
  width:100%;border:2px solid #d8dfeb;border-radius:12px;
  padding:13px 16px;font-size:17px;background:#f8fafc;
  outline:none;transition:.15s;text-align:center;font-weight:700;
  color:#1c2333;
}
.login-card input::placeholder{font-weight:500;color:#b6bdcb}
.login-card input:focus{
  border-color:#1B3A6B;background:#fff;
  box-shadow:0 0 0 4px rgba(27,58,107,.1);
}
.login-card > button{
  width:100%;margin-top:14px;padding:13px;
  background:#1B3A6B;color:#fff;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;transition:.15s;
  letter-spacing:2px;
}
.login-card > button:hover{background:#24478a}
.login-card > button:active{transform:scale(.98)}
.login-error{
  color:#E63946;font-size:13px;margin-top:10px;
  text-align:center;font-weight:600;
  animation:shake .3s ease;
}
.login-error[hidden]{display:none}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

.app-header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(120deg,#1B3A6B 0%,#28508f 100%);
  color:#fff;box-shadow:0 4px 14px rgba(15,30,60,.25);
}
.app-title{
  display:flex;align-items:center;gap:10px;padding:10px 16px 4px;
  max-width:1200px;margin:0 auto;flex-wrap:wrap;
}
.app-title h1{font-size:17px;font-weight:700;letter-spacing:.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.operator{display:flex;align-items:center;gap:6px;font-size:12px;color:#dbe6f7}

.operator-name{
  font-size:12px;
  font-weight:700;
  color:#fff;
  padding:4px 12px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.3);
  border-radius:8px;
  min-width:80px;
  text-align:center;
  letter-spacing:.5px;
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
  white-space:nowrap;
}

.logout-btn{
  background:rgba(255,255,255,.12);
  color:#dbe6f7;border:1px solid rgba(255,255,255,.3);
  border-radius:999px;padding:4px 10px;font-size:11px;
  font-weight:600;cursor:pointer;transition:.15s;
  white-space:nowrap;
}
.logout-btn:hover{background:rgba(255,255,255,.25);color:#fff;border-color:rgba(255,255,255,.5)}

.sync-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;background:rgba(255,255,255,.15);
  padding:4px 10px;border-radius:999px;
  white-space:nowrap;cursor:pointer;transition:.15s;
  border:1px solid rgba(255,255,255,.15);
}
.sync-badge:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4)}
.sb-led{
  width:6px;height:6px;border-radius:50%;
  background:#9aa3b5;flex:none;
  transition:background .2s, box-shadow .2s;
}
.sync-badge.online .sb-led{background:#2edb7a;box-shadow:0 0 6px rgba(46,219,122,.8)}
.sync-badge.offline .sb-led{background:#E63946;box-shadow:0 0 6px rgba(230,57,70,.7)}
.sync-badge.connecting .sb-led{background:#FF9F1C;box-shadow:0 0 6px rgba(255,159,28,.8);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sb-status{font-weight:600;letter-spacing:.2px}
.sb-room{
  font-family:"JetBrains Mono","Menlo",monospace;
  font-size:10.5px;letter-spacing:.05em;
  padding-left:8px;border-left:1px solid rgba(255,255,255,.25);
  opacity:.85;
}

.tab-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 12px 12px;max-width:1200px;margin:0 auto}
.tab{
  border:none;background:transparent;font-family:inherit;cursor:pointer;
  display:block;text-align:center;color:#dbe6f7;text-decoration:none;
  font-size:14px;font-weight:600;padding:8px 4px;border-radius:10px;transition:.15s;
}
.tab:hover{background:rgba(255,255,255,.1)}
.tab.active{background:#fff;color:#1B3A6B;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tab .tab-sub{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:1px}
footer{text-align:center;padding:20px;background-color:#fffdd9;font-size:12px;color:#8a93a6}

main{max-width:1200px;margin:0 auto;padding:16px;flex:1;width:100%}
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{
  background:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(20,30,60,.06);
  padding:16px 18px;margin-bottom:16px;
}
.card h2{
  font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;
  padding-left:10px;border-left:4px solid #1B3A6B;color:#1c2333;
}
.card h2 .h2-tag{font-size:11px;font-weight:500;color:#8a93a6;margin-left:auto}
.hint{font-size:12px;color:#8a93a6;margin-top:8px;line-height:1.6}
.hint kbd{
  background:#eef2f9;border:1px solid #d5dceb;border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit;font-weight:700;
}
.warn-text{color:#E63946;font-weight:700}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field>label{font-size:12px;color:#6b7488;font-weight:600}
input[type=number],input[type=text],input[type=password],select{
  border:1px solid #d8dfeb;border-radius:10px;padding:9px 12px;background:#f8fafc;min-width:0;
  width:100%;transition:.15s;font-variant-numeric:tabular-nums;outline:none;color:#1c2333;
}
input:focus,select:focus{outline:2px solid #7EC8E3;border-color:#1B3A6B;background:#fff}

.btn{
  border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;
  background:#e8edf5;color:#1c2333;transition:.15s;white-space:nowrap;
}
.btn:hover{filter:brightness(.95)}
.btn:active{transform:scale(.98)}
.btn.primary{background:#1B3A6B;color:#fff}
.btn.primary:hover{background:#24478a}
.btn.warn{background:#FF9F1C;color:#3a2400}
.btn.warn:hover{background:#e88c0d}
.btn.danger{background:#E63946;color:#fff}
.btn.danger:hover{background:#cf2b38}
.btn.small{padding:7px 12px;font-size:13px}
.btn.full{width:100%;margin-bottom:12px}
.btn-col{display:flex;flex-direction:column;gap:10px}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}

.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #e6ebf4;-webkit-overflow-scrolling:touch}
#adminTable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
#adminTable th{
  background:#f1f4fa;text-align:left;padding:9px 10px;font-size:12px;color:#6b7488;
  border-bottom:2px solid #e3e8f0;white-space:nowrap;font-weight:700;
}
#adminTable td{padding:9px 10px;border-bottom:1px solid #eef1f7;vertical-align:middle;font-variant-numeric:tabular-nums}
#adminTable tr:last-child td{border-bottom:none}
#adminTable tr.used-row{background:#f4f5f7}
#adminTable tr.used-row td{opacity:.55}
#adminTable .stacks-input,#adminTable .remain-input{width:82px;padding:6px 9px;font-size:14px}
#adminTable .apply-row{padding:6px 12px;font-size:12px;border-radius:8px}
#adminTable .stack-remain-cell{white-space:nowrap;font-weight:700}
#adminTable .stack-remain-cell .sr-main{color:#1B3A6B}
#adminTable .stack-remain-cell .sr-loose{color:#c26a00;font-size:12.5px}
#adminTable .stack-remain-cell .sr-out{color:#E63946;font-weight:800}

.stack-edit-table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.stack-edit-table th{background:#f1f4fa;padding:8px 10px;font-size:12px;color:#6b7488;border-bottom:2px solid #e3e8f0;text-align:left;font-weight:700;white-space:nowrap}
.stack-edit-table td{padding:7px 10px;border-bottom:1px solid #eef1f7;vertical-align:middle}
.stack-edit-table input[type=number]{width:90px;padding:6px 9px;font-size:13.5px}

.swatch{
  display:inline-block;width:22px;height:22px;border-radius:7px;
  vertical-align:middle;margin-right:8px;border:1px solid rgba(0,0,0,.12);
}
.dot{width:22px;height:22px;border-radius:7px;flex:none;display:inline-block;border:1px solid rgba(0,0,0,.08)}

.tag{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;
  background:#eef1f6;color:#8a93a6;font-weight:700;white-space:nowrap;
}
.tag.used{background:#dcfce7;color:#15803d}
.tag-warn{display:inline-block;background:#FFD93D;color:#5a4000;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;white-space:nowrap}
.tag-out{display:inline-block;background:#E63946;color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;white-space:nowrap}
.tag-used{display:inline-block;background:#2e9e6b;color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}

.log-list{list-style:none;max-height:400px;overflow:auto}
.log-list li{
  display:flex;gap:8px;padding:7px 4px;border-bottom:1px dashed #e6ebf4;
  font-size:13px;align-items:baseline;
}
.log-list li:last-child{border-bottom:none}
.log-list li.empty{color:#8a93a6;justify-content:center;padding:20px}
.log-time{color:#9aa3b5;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.log-who{font-weight:700;color:#1B3A6B;white-space:nowrap}
.log-act{color:#6b7488;word-break:break-all}

#page-cash{--theme:#2e9e6b}
#page-epay{--theme:#2a4d8f}
.channel-page .card h2{color:var(--theme);border-left-color:var(--theme)}
.channel-page .btn.primary{background:var(--theme);color:#fff}
.channel-page .btn.primary:hover{filter:brightness(1.1)}
.channel-page input:focus,.channel-page select:focus{outline-color:var(--theme);border-color:var(--theme)}
.channel-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.span-full{grid-column:1/-1}

.current-meta{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:13.5px;color:#6b7488;font-weight:600;
  align-items:center;
}
.current-meta b{color:var(--theme);font-size:17px;font-variant-numeric:tabular-nums}
.current-meta .meta-sold{
  display:inline-flex;align-items:center;gap:8px;
  background:#fff4e6;border:1px solid #FF9F1C;border-radius:10px;
  padding:6px 14px;color:#8a5a00;font-weight:700;font-size:13px;
}
.current-meta .meta-sold b{color:#c26a00;font-size:22px;line-height:1}

.active-stacks-display{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:12px}
.active-stack-card{
  border-radius:14px;padding:14px 12px;position:relative;display:flex;flex-direction:column;gap:3px;
  font-weight:800;min-height:112px;justify-content:center;align-items:center;text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.08);
}
.active-stack-card .asc-name{font-size:24px;letter-spacing:2px;line-height:1.1}
.active-stack-card .asc-stack{font-size:12px;opacity:.85;font-weight:600}
.active-stack-card .asc-remain{font-size:14px;font-weight:800}
.active-stack-card .asc-remove{
  position:absolute;top:6px;right:8px;background:rgba(0,0,0,.22);color:#fff;border:none;
  border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.active-stack-card .asc-remove:hover{background:rgba(0,0,0,.45)}
.active-stack-card.sold-out{outline:3px solid #E63946;outline-offset:-3px}
.active-stack-card.sold-out::after{
  content:'沽清';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  background:#E63946;color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;
  padding:1px 9px;border-radius:999px;
}

.sell-controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sell-controls .sell-target{flex:2 1 160px}
.sell-controls .sell-qty{flex:0 0 90px}
.sell-btn{
  flex:1;padding:14px;font-size:16px;font-weight:800;border-radius:10px;border:none;
  background:#2e9e6b;color:#fff;transition:.15s;min-width:110px;
}
.sell-btn:hover{background:#25825a}
.sell-btn:active{transform:scale(0.98)}
.sell-btn.sold-out{background:#9aa3b5 !important;cursor:not-allowed}
.sell-btn.sold-out:hover{background:#9aa3b5 !important}
.undo-btn{
  flex:1;padding:14px;font-size:16px;font-weight:800;border-radius:10px;border:none;
  background:#E63946;color:#fff;transition:.15s;min-width:110px;
}
.undo-btn:hover{background:#cf2b38}
.undo-btn:active{transform:scale(0.98)}
.schedule-info{
  font-size:13px;color:#6b7488;font-weight:600;margin-top:4px;
  background:#f6f8fc;padding:8px 12px;border-radius:8px;
  display:inline-block;
}

.color-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:6px}
.color-pick{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border:2px solid #e3e8f0;border-radius:12px;padding:9px 6px;background:#fbfcfe;
  font-size:12.5px;font-weight:600;color:#1c2333;transition:.12s;font-family:inherit;
}
.color-pick:hover:not(:disabled){border-color:var(--theme);transform:translateY(-1px)}
.color-pick.active{border-color:var(--theme);background:#eef4ff;box-shadow:0 0 0 2px rgba(27,58,107,.15)}
.color-pick:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.35)}
.color-pick .cp-tag{font-size:10.5px;font-weight:600;color:#8a93a6}
.color-pick.used-color{border-style:dashed}

.used-grid{display:flex;flex-wrap:wrap;gap:8px}
.used-chip{
  display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 5px;
  font-size:12.5px;font-weight:700;background:#eef1f6;color:#9aa3b5;
  border:1px dashed #ccd4e2;
}
.used-chip.on{border-style:solid;border-color:transparent;color:#1c2333}
.used-chip.sold-out-chip{box-shadow:0 0 0 2px #E63946 inset;opacity:1}

#page-board{display:none;max-width:none;width:100%;padding:10px 14px;margin:0}
#page-board.active{display:block}
body.board-mode main{padding:0;overflow:hidden;max-width:none}

.board{
  background:#0f1626;border-radius:20px;padding:16px 20px;color:#e8eefb;
  min-height:calc(100vh - 44px);display:flex;flex-direction:column;gap:12px;
  overflow:hidden;
}
.board-header{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08);
}
.board-header-left{display:flex;align-items:center}
.board-header-center{text-align:center}
.board-header-right{text-align:right}
.board-session{font-size:20px;font-weight:800;letter-spacing:1px}
.board-schedule{font-size:14px;color:#FFD93D;margin-top:4px;font-weight:600;}
.board-password{font-size:18px;color:#FFD93D;margin-top:6px;font-weight:800;letter-spacing:1px;}
.board-clock{font-size:14px;color:#9fb2cf;font-variant-numeric:tabular-nums;margin-top:2px}
.board-stat{
  display:flex;align-items:baseline;gap:10px;
  background:rgba(255,159,28,.12);border:1px solid rgba(255,159,28,.35);
  border-radius:10px;padding:8px 14px;
}
.board-stat-label{font-size:12px;color:#FFD93D;letter-spacing:.5px}
.board-stat-value{font-size:26px;font-weight:900;color:#FFD93D;font-variant-numeric:tabular-nums;line-height:1}
.board-stat-unit{font-size:12px;color:#c7d4ea;opacity:.85}
.board-fs{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;white-space:nowrap;
}
.board-fs:hover{background:rgba(255,255,255,.2)}

.board-channels{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1 1 auto;min-height:0}
.board-channel{display:flex;flex-direction:column;gap:8px;min-height:0}
.board-channel-title{font-size:15px;font-weight:700;color:#c7d4ea;letter-spacing:1px}
.board-stack-grid{display:grid;gap:10px;flex:1;min-height:0;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.board-color-box{
  border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;border:2px solid rgba(255,255,255,.15);transition:.3s;
  font-size:clamp(24px,3.6vw,58px);font-weight:900;letter-spacing:5px;padding:10px;
  position:relative;min-height:110px;
}
.board-color-box .bcs-stack{font-size:13px;letter-spacing:1px;font-weight:700;opacity:.85;margin-top:6px}
.board-color-box.empty{background:#22304a;color:#9fb2cf;font-size:22px;letter-spacing:2px;border-color:rgba(255,255,255,.12)}
.board-color-box.sold-out{border-color:#E63946 !important;box-shadow:0 0 0 3px rgba(230,57,70,.35) inset}
.board-color-box.sold-out::after{
  content:"沽清";position:absolute;top:10px;right:12px;
  background:#E63946;color:#fff;font-size:12px;font-weight:800;letter-spacing:2px;
  padding:3px 11px;border-radius:999px;
}
.board-bottom{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;flex:0 0 auto}
.board-used h3,.board-remain h3{
  font-size:15px;font-weight:700;color:#c7d4ea;margin:8px 0;letter-spacing:.5px;
}
.board-used-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.board-used-cell{
  border-radius:12px;min-height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:12.5px;font-weight:700;
  background:#1b2536;color:#55627a;border:1px dashed #2c3a52;transition:.2s;
}
.board-used-cell.on{border-style:solid;border-color:transparent}
.board-used-cell.sold-out-cell{box-shadow:0 0 0 2px #E63946 inset}
.board-remain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.board-remain-cell{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-radius:10px;background:#182338;border:1px solid #243350;
  font-size:12.5px;font-weight:700;min-width:0;
}
